<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CropCare AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">✿</span> CropCare AI</a>
    <nav><a href="{{ url_for('index') }}">Detect</a><a href="{{ url_for('dashboard') }}">Dashboard</a></nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>CropCare AI · Educational crop-health screening prototype</footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
